services:
  - type: web
    name: sigem-tecnm-veracruz
    runtime: php
    plan: free
    buildCommand: composer install --no-dev --optimize-autoloader && php artisan filament:assets && php artisan config:cache && php artisan route:cache && php artisan view:cache
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: PHP_VERSION
        value: "8.4"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://sigem-tecnm-veracruz.onrender.com
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: database/database.sqlite
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_LOCALE
        value: es
